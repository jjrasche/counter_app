# .github/workflows/ci.yml

name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        platform: [web, android] # ios commented out - requires code signing
        include:
          - platform: web
            os: ubuntu-latest
            device: chrome
          - platform: android
            os: ubuntu-latest
            device: emulator
          # - platform: ios
          #   os: macos-latest
          #   device: iPhone
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
      
      - run: flutter pub get
      
      - name: Run Android tests
        if: matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          script: flutter test integration_test/ -d emulator

      - name: Install ChromeDriver
        if: matrix.platform == 'web'
        run: npx @puppeteer/browsers install chromedriver@stable

      - name: Start ChromeDriver
        if: matrix.platform == 'web'
        run: chromedriver --port=4444 &

      - name: Run web tests
        if: matrix.platform == 'web'
        run: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/counter_test.dart -d web-server

      # iOS tests commented out - requires code signing for deployment
